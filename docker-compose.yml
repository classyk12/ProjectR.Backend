services:
  projectr.backend:
    build:
      context: .
      dockerfile: src/Dockerfile

    container_name: projectr-api
    depends_on:
      db:
        condition: service_started
      seq:
        condition: service_started

    networks:       
      - mynetwork

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection= Server=sqlserver_db;Database=projectr;User Id=SA;Password=YourStrongPassword123!;TrustServerCertificate=True; # Update with your database name and password

      - Google__Android=${Google__Android}
      - Google__Ios=${Google__Ios}
      - Google__Web=${Google__Web}
      - Google__UseMock=${Google__UseMock}

      - WhatsApp__PhoneNumberId=${WhatsApp__PhoneNumberId}
      - WhatsApp__BaseUrl=${WhatsApp__BaseUrl}
      - WhatsApp__AccessToken=${WhatsApp__AccessToken}
      - WhatsApp__BusinessAccountId=${WhatsApp__BusinessAccountId}
      - WhatsApp__UseMock=${WhatsApp__UseMock}

      # - Cloudinary__CloudName=${Cloudinary__CloudName}
      # - Cloudinary__ApiKey=${Cloudinary__ApiKey}
      # - Cloudinary__ApiSecret=${Cloudinary__ApiSecret}

      # Serilog Seq config
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:5341

    ports:
      - "5000:5000"
      - "5001:5001"
     
  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: projectr

    ports:
      - "4400:80"
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

    networks:
      - mynetwork

  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: always
    ports:
      - "5341:80" # UI accessible on http://localhost:5341
    volumes:
      - seq_data:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Test@1234   # optional: sets admin password on first run
    networks:
      - mynetwork

volumes:
  postgres_data:
  seq_data:

networks:
  mynetwork:
