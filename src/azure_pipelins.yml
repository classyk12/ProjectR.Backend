trigger:
  branches:
    include:
      - develop
      - pipe_fix

pool:
  name: "Default"
  demands:
    - Agent.Name -equals vm-pkw-db-monitor

variables:
  DOCKERHUB_USERNAME: "temilayon"
  DOCKERHUB_ProR: "temilayon/projectr.backend"
  DOCKER_TAG: "latest"

steps:
  - checkout: self

  - task: Docker@2
    displayName: "Login to Docker Hub"
    inputs:
      command: login
      containerRegistry: "docker_svc_con_L"

  - script: |
      mkdir -p ~/.docker/cli-plugins
      curl -L https://github.com/docker/buildx/releases/latest/download/buildx-linux.amd64 \
        -o ~/.docker/cli-plugins/docker-buildx
      chmod +x ~/.docker/cli-plugins/docker-buildx
      docker buildx version
    displayName: "Install Docker Buildx"

  - script: |
      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --use --name mybuilder
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t $(DOCKERHUB_ProR):$(DOCKER_TAG) \
        --push .
    displayName: "Build and Push with Docker Buildx"

  # (Optional) Verify push by pulling image back
  - script: |
      echo "Pulling Docker image from Docker Hub..."
      docker pull "$(DOCKERHUB_ProR):$(DOCKER_TAG)"
    displayName: "Pull Docker Image from Docker Hub"

  # Start containers using a custom shell script
  - script: |
      echo "Starting containers using Docker Compose..."
      cd /opt/ProjectR/build
      sudo bash startsvcs.dynamic.sh
    displayName: "Start Docker Containers"

  # Uncomment if you want to push services using DockerCompose task
  # - task: DockerCompose@0
